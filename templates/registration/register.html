{% extends 'base.html' %}

{% block title %}Register — Intrusion Detection System{% endblock %}

{% block content %}

<div style="max-width: 460px; margin: 2.5rem auto; padding: 2rem; background: var(--color-bg-card); border-radius: 16px; border: 1px solid var(--color-border); box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
        <span style="font-size: 3rem; display: block; margin-bottom: 0.5rem;">👤</span>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--color-text-primary);">Create User Account</h1>
        <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 4px;">
            Register to analyze network traffic & save prediction history
        </p>
    </div>

    <form method="POST" action="{% url 'detector:register' %}">
        {% csrf_token %}

        <div style="margin-bottom: 1.1rem;">
            <label for="username" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px;">
                Username <span style="color:var(--color-danger);">*</span>
            </label>
            <input type="text" id="username" name="username" required autofocus placeholder="Choose a unique username"
                   style="width: 100%; padding: 10px 14px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 8px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.1rem;">
            <label for="email" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px;">
                Email Address <span style="font-size:0.75rem; color:var(--color-text-muted);">(Optional)</span>
            </label>
            <input type="email" id="email" name="email" placeholder="user@example.com"
                   style="width: 100%; padding: 10px 14px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 8px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.1rem;">
            <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px;">
                Password <span style="color:var(--color-danger);">*</span>
            </label>
            <input type="password" id="password" name="password" required placeholder="Minimum 6 characters"
                   style="width: 100%; padding: 10px 14px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 8px; font-size: 0.95rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="confirm_password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px;">
                Confirm Password <span style="color:var(--color-danger);">*</span>
            </label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password"
                   style="width: 100%; padding: 10px 14px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 8px; font-size: 0.95rem;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, #00d4ff, #0077ff); border: none; color: #fff; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,212,255,0.3); transition: all 0.2s;">
            ✨ Register Account
        </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 1rem;">
        Already registered? 
        <a href="{% url 'detector:login' %}" style="color: var(--color-accent); font-weight: 600;">Log in here</a>
    </div>
</div>

{% endblock %}
